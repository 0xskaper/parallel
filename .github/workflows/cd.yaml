on:
  push:
    branches: [nexus]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PRIME_SSH }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 64.247.206.67 >> ~/.ssh/known_hosts
      - name: Deploy PRIME
        run: |
          ssh -T -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no ubuntu@64.247.206.67 << 'EOF'
          cd ~/parallel
          git pull origin nexus
          echo "SUCCESS"
          EOF
